<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>NexusPen: instellingen, tekst en lettertype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Andika:wght@400;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=Lexend:wght@400;600&amp;family=Nunito:wght@700;800&amp;family=Patrick+Hand&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A3E635}a:hover{color:#C5F57A}
.nav{height:38px;border:0;border-radius:8px;background:transparent;color:#D4D4D8;font-family:Inter,'Segoe UI',sans-serif;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;padding:0 10px;text-align:left;width:100%}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.card{border:0;border-radius:10px;background:#27272A;color:#E4E4E7;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;font-family:Inter,'Segoe UI',sans-serif;cursor:pointer}
.seg{height:32px;padding:0 12px;border:0;border-radius:8px;background:#27272A;color:#E4E4E7;font-family:Inter,'Segoe UI',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.lbl{margin:0;font-size:13px;font-weight:600;color:#D4D4D8}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #6B7079; font-family: Inter, 'Segoe UI', system-ui, sans-serif">

  <!-- Gedimd scherm erachter -->
  <div aria-hidden="true" style="position: absolute; left: 230px; top: 150px; width: 820px; height: 620px; background: #A9ADB4; border-radius: 6px"></div>

  <!-- Venster -->
  <div role="dialog" aria-label="NexusPen instellingen" style="position: absolute; left: 150px; top: 50px; width: 980px; height: 700px; background: #18181B; border: 1px solid #27272A; border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,0.45); display: flex; overflow: hidden">

    <!-- Menu links -->
    <nav aria-label="Onderdelen" style="width: 224px; flex-shrink: 0; background: #131316; border-right: 1px solid #27272A; padding: 18px 12px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px"><div style="display: flex; align-items: center; gap: 10px; margin: 0 10px 14px"><svg role="img" aria-label="NexusPen" viewBox="0 0 64 64" style="width: 26px; height: 26px; display: block; flex-shrink: 0"><rect width="64" height="64" rx="14" fill="#FF8000"/><path d="M19.50 34.50 L19.50 21.87 Q19.50 12.87 24.42 20.41 L39.58 43.59 Q44.50 51.13 44.50 42.13 L44.50 17.00" fill="none" stroke="#FFFFFF" stroke-width="8.0" stroke-linecap="round" stroke-linejoin="round"/><rect x="15.5" y="30.5" width="8.0" height="8.0" fill="#FFFFFF"/><defs><clipPath id="npCone"><path d="M15.50 38.50 Q16.10 44.50 19.05 50.55 Q19.50 51.47 19.95 50.55 Q22.90 44.50 23.50 38.50 Z"/></clipPath></defs><path d="M15.50 38.50 Q16.10 44.50 19.05 50.55 Q19.50 51.47 19.95 50.55 Q22.90 44.50 23.50 38.50 Z" fill="#FFFFFF"/><g clip-path="url(#npCone)"><path d="M14.5 37.5 H18.22 L19.50 51.01 L14.5 52.0114406779661 Z" fill="#FFFFFF"/><path d="M20.78 37.5 H24.5 V52.0114406779661 L19.50 51.01 Z" fill="#FFFFFF"/><path d="M17.30 46.40 Q18.04 48.47 19.05 50.55 Q19.50 51.47 19.95 50.55 Q20.96 48.47 21.70 46.40 Z" fill="#1A0F00"/><clipPath id="npGraf"><path d="M17.30 46.40 Q18.04 48.47 19.05 50.55 Q19.50 51.47 19.95 50.55 Q20.96 48.47 21.70 46.40 Z"/></clipPath><g clip-path="url(#npGraf)"><path d="M16.80 46.40 H18.51 L19.50 51.01 L16.80 51.01 Z" fill="#4B3019"/><path d="M18.20 47.00 L18.60 48.81" stroke="#9C7A58" stroke-width="0.35" stroke-linecap="round" stroke-opacity="0.4"/></g></g><path d="M15.5 38.1 V38.5 A2.0 2.0 0 0 0 19.5 38.5 A2.0 2.0 0 0 0 23.5 38.5 V38.1 Z" fill="#FFFFFF"/></svg><p style="margin: 0; font-size: 16px; font-weight: 700; color: #FAFAFA">Instellingen</p></div><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/> <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>Algemeen</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="m5 8 6 6"/> <path d="m4 14 6-6 2-3"/> <path d="M2 5h12"/> <path d="M7 2h1"/> <path d="m22 22-5-10-5 10"/> <path d="M14 18h6"/></svg></span>Taal</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/> <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/> <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/> <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/> <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg></span>Uiterlijk</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><rect width="20" height="12" x="2" y="6" rx="2"/></svg></span>Werkbalk</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/> <path d="m15 5 4 4"/></svg></span>Pen en kleuren</button><button style="height: 38px; border: 0; border-radius: 8px; background: #2E2E33; color: #FFFFFF; font-weight: 700; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="color: {{accent}}; display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M12 4v16"/> <path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/> <path d="M9 20h6"/></svg></span>Tekst</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M14 13V8.5C14 7 15 7 15 5a3 3 0 0 0-6 0c0 2 1 2 1 3.5V13"/> <path d="M20 15.5a2.5 2.5 0 0 0-2.5-2.5h-11A2.5 2.5 0 0 0 4 15.5V17a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1z"/> <path d="M5 22h14"/></svg></span>Stempels</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M2 3h20"/> <path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/> <path d="m7 21 5-5 5 5"/></svg></span>Bord en achtergrond</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/> <path d="M16 9a5 5 0 0 1 0 6"/> <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg></span>Voorlezen</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M10 8h.01"/> <path d="M12 12h.01"/> <path d="M14 8h.01"/> <path d="M16 12h.01"/> <path d="M18 8h.01"/> <path d="M6 8h.01"/> <path d="M7 16h10"/> <path d="M8 12h.01"/> <rect width="20" height="16" x="2" y="4" rx="2"/></svg></span>Sneltoetsen</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/> <path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/> <path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg></span>Opslaan</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M12 17v4"/> <path d="M17 17H4a2 2 0 0 1-2-2V5a2 2 0 0 1 1.184-1.826"/> <path d="m2 2 20 20"/> <path d="M8 21h8"/> <path d="M8.656 3H20a2 2 0 0 1 2 2v10a2 2 0 0 1-.293 1.042"/></svg></span>Schermdelen</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><path d="M5 21v-6"/> <path d="M12 21V3"/> <path d="M19 21V9"/></svg></span>Gebruik</button><button style="height: 38px; border: 0; border-radius: 8px; background: transparent; color: #D4D4D8; font-weight: 500; font-family: Inter, 'Segoe UI', sans-serif; font-size: 14px; display: flex; align-items: center; gap: 10px; padding: 0 10px; text-align: left; width: 100%"><span style="display: flex"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0"><circle cx="12" cy="12" r="10"/> <path d="M12 16v-4"/> <path d="M12 8h.01"/></svg></span>Hulp en foutlog</button><p style="margin: auto 10px 0; font-size: 12px; color: #8B8B94">NexusPen 1.2, Nexus of Language</p></nav>

    <!-- Inhoud: Tekst -->
    <div style="flex-grow: 1; padding: 22px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; color: #E4E4E7">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #FAFAFA">Tekst</h1>
        <button aria-label="Sluiten" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: #27272A; color: #D4D4D8; display: flex; align-items: center; justify-content: center; padding: 0"><svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"><path d="M18 6 6 18"/> <path d="m6 6 12 12"/></svg></button>
      </div>

      <!-- Lettertype -->
      <div style="display: flex; flex-direction: column; gap: 10px">
        <p class="lbl">Lettertype <span style="font-weight: 400; color: #8B8B94">(klik op Play en kies er een: het voorbeeld hieronder verandert mee)</span></p>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <sc-for list="{{fonts}}" as="f" hint-placeholder-count="6">
            <button class="card" onClick="{{f.pick}}" aria-pressed="{{f.on}}" style="{{f.style}}">
              <span style="font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px">{{f.name}}<span style="{{f.tagStyle}}">{{f.tag}}</span></span>
              <span style="font-size: 12px; color: #A1A1AA">{{f.desc}}</span>
              <span style="font-family: {{f.css}}; font-weight: {{f.weight}}; font-size: 20px; color: #FAFAFA">Ik ga met de trein.</span>
            </button>
          </sc-for>
        </div>
      </div>

      <!-- Rand om tekst -->
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <p class="lbl">Rand om tekst</p>
          <button role="switch" aria-checked="{{rand}}" aria-label="Rand om tekst" onClick="{{toggleRand}}" style="width: 44px; height: 24px; border: 0; border-radius: 12px; background: {{switchBg}}; position: relative; padding: 0; cursor: pointer"><span style="position: absolute; {{knobPos}}; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: {{knobBg}}"></span></button>
        </div>
        <div style="display: flex; align-items: center; gap: 18px; flex-wrap: wrap">
          <div style="display: flex; align-items: center; gap: 6px">
            <span style="font-size: 13px; color: #A1A1AA; margin-right: 4px">Dikte</span>
            <sc-for list="{{thick}}" as="t" hint-placeholder-count="3"><button class="seg" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button></sc-for>
          </div>
          <div style="display: flex; align-items: center; gap: 6px">
            <span style="font-size: 13px; color: #A1A1AA; margin-right: 4px">Randkleur</span>
            <sc-for list="{{edge}}" as="e" hint-placeholder-count="3"><button class="seg" onClick="{{e.pick}}" style="{{e.style}}">{{e.label}}</button></sc-for>
          </div>
        </div>
        <!-- Voorbeeld op drie achtergronden, in het gekozen lettertype -->
        <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-radius: 10px; overflow: hidden; height: 96px">
          <sc-for list="{{previews}}" as="p" hint-placeholder-count="3">
            <div style="background: {{p.bg}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 240 60" style="width: 230px; height: 60px"><text x="120" y="42" text-anchor="middle" font-family="{{fontCss}}" font-weight="{{fontWeight}}" font-size="{{fontSize}}" fill="{{p.fill}}" stroke="{{p.stroke}}" stroke-width="{{strokeW}}" stroke-linejoin="round" paint-order="stroke">Goed zo!</text></svg></div>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 12px; color: #8B8B94">Zo komt het op het bord: {{fontName}}, {{randText}}.</p>
      </div>

      <!-- Grootte en stijl -->
      <div style="display: flex; align-items: center; gap: 24px">
        <div style="display: flex; align-items: center; gap: 10px; width: 340px">
          <span style="font-size: 13px; color: #A1A1AA">Standaardgrootte</span>
          <div aria-hidden="true" style="flex-grow: 1; height: 4px; border-radius: 2px; background: #3F3F46; position: relative"><div style="position: absolute; left: 0; top: 0; width: 45%; height: 4px; border-radius: 2px; background: {{accent}}"></div><div style="position: absolute; left: calc(45% - 8px); top: -6px; width: 16px; height: 16px; border-radius: 50%; background: #FFFFFF"></div></div>
          <span style="font-size: 13px; font-weight: 600; color: #E4E4E7">36 px</span>
        </div>
        <div style="display: flex; align-items: center; gap: 6px">
          <button class="seg" style="background: #3F3F46; box-shadow: inset 0 0 0 1.5px {{accent}}; font-weight: 800">Vet</button>
          <button class="seg">Vak erachter</button>
        </div>
        <p style="margin: 0 0 0 auto; font-size: 12px; color: #8B8B94">Wijzigingen gelden meteen</p>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A3E635","options":["#A3E635","#38BDF8","#FB923C","#F472B6"]},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { font: 1, rand: true, thick: 1, edge: 0 };
  }
  renderVals() {
    const st = this.state;
    const accent = this.props.accent ?? '#A3E635';
    const F = [
      { name: 'Segoe UI', desc: 'Standaard van Windows', css: "'Segoe UI', Inter, sans-serif", weight: 700, size: 30 },
      { name: 'Andika', desc: 'Gemaakt voor beginnende lezers en Alfa', css: 'Andika, sans-serif', weight: 700, size: 30, tag: 'Aanbevolen' },
      { name: 'Atkinson Hyperlegible', desc: 'Extra goed leesbaar, ook voor slechtzienden', css: "'Atkinson Hyperlegible', sans-serif", weight: 700, size: 30 },
      { name: 'Lexend', desc: 'Rustig en ruim, prettig bij lange zinnen', css: 'Lexend, sans-serif', weight: 600, size: 29 },
      { name: 'Nunito', desc: 'Rond en vriendelijk, de huisstijl van Nexus', css: 'Nunito, sans-serif', weight: 800, size: 30 },
      { name: 'Patrick Hand', desc: 'Handschrift, toch goed te lezen', css: "'Patrick Hand', cursive", weight: 400, size: 34 }
    ];
    const f = F[st.font];
    const sel = (on) => on ? 'background: #3F3F46; box-shadow: inset 0 0 0 1.5px ' + accent : '';
    const widths = [3, 6, 9];
    const edgeFor = (bg) => {
      if (st.edge === 0) return '#000000';
      if (st.edge === 1) return '#FFFFFF';
      return '#000000';
    };
    const previews = [
      { bg: '#FFFFFF', fill: '#FACC15' },
      { bg: '#24463A', fill: '#FFFFFF' },
      { bg: '#E8590C', fill: '#FFFFFF' }
    ].map((p) => ({ bg: p.bg, fill: (st.edge === 1 && p.fill === '#FFFFFF') ? '#111111' : p.fill, stroke: st.rand ? edgeFor(p.bg) : 'none' }));
    return {
      accent: accent,
      fonts: F.map((x, i) => ({
        name: x.name, desc: x.desc, css: x.css, weight: x.weight,
        on: i === st.font,
        style: i === st.font ? 'background: #3F3F46; box-shadow: inset 0 0 0 2px ' + accent : '',
        tag: x.tag || '',
        tagStyle: x.tag ? 'font-size: 11px; font-weight: 700; color: #111407; background: ' + accent + '; border-radius: 4px; padding: 1px 6px' : 'display: none',
        pick: () => this.setState({ font: i })
      })),
      rand: st.rand,
      toggleRand: () => this.setState({ rand: !st.rand }),
      switchBg: st.rand ? accent : '#3F3F46',
      knobPos: st.rand ? 'right: 3px' : 'left: 3px',
      knobBg: st.rand ? '#111407' : '#A1A1AA',
      thick: ['Dun', 'Middel', 'Dik'].map((l, i) => ({ label: l, style: sel(i === st.thick), pick: () => this.setState({ thick: i }) })),
      edge: ['Zwart', 'Wit', 'Automatisch'].map((l, i) => ({ label: l, style: sel(i === st.edge), pick: () => this.setState({ edge: i }) })),
      previews: previews,
      fontCss: f.css, fontWeight: f.weight, fontSize: f.size,
      strokeW: st.rand ? widths[st.thick] : 0,
      fontName: f.name,
      randText: st.rand ? (['dunne', 'middel', 'dikke'][st.thick] + ' ' + ['zwarte', 'witte', 'automatische'][st.edge] + ' rand') : 'zonder rand'
    };
  }
}
</script>
</body>
</html>
