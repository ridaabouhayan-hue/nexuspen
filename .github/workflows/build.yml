name: Bouwen en testen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: NexusPen bouwen en tests draaien
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build\build.ps1

      - name: Opstarttest (programma start en stopt netjes)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "out\NexusPen.exe" -ArgumentList "--zelftest" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Zelftest hangt (langer dan 3 minuten)" }
          if ($p.ExitCode -ne 0) { throw "Zelftest mislukt met code $($p.ExitCode)" }

      - name: Versie bepalen
        id: versie
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart("v") } else { $v = "1.2.0" }
          "nummer=$v" >> $env:GITHUB_OUTPUT

      - name: Installer maken (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.versie.outputs.nummer }}" installer\NexusPen.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer maken mislukt" }

      - name: Bestanden bewaren
        uses: actions/upload-artifact@v4
        with:
          name: NexusPen-${{ steps.versie.outputs.nummer }}
          path: |
            out/NexusPen.exe
            out/NexusPen-Setup.exe

      - name: Schermafbeeldingen van de zelftest bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexusPen-schermen
          path: out/schermen/*.png
          if-no-files-found: warn

      - name: Schermafbeeldingen op een aparte tak zetten (om te bekijken)
        if: always() && github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if (-not (Test-Path out\schermen)) { exit 0 }
          $d = Join-Path $env:RUNNER_TEMP "schermen"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item out\schermen\*.png $d
          Set-Location $d
          git init -q -b zelftest-schermen
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Schermen van ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" zelftest-schermen

      - name: Release maken bij een versietag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NexusPen ${{ steps.versie.outputs.nummer }}
          body_path: docs/RELEASE.md
          files: |
            out/NexusPen-Setup.exe
            out/NexusPen.exe
